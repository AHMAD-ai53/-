name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip my project
        run: |
          unzip -q "$(ls *.zip | head -1)" -d proj

      - name: Download Forge MDK 1.20.1
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk

      - name: Merge our mod into the MDK
        run: |
          rm -rf mdk/src
          cp -r proj/src mdk/src
          cat proj/gradle_additions.gradle >> mdk/build.gradle
          sed -i 's/^mod_id=.*/mod_id=cutscene/' mdk/gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=com.shabah.cutscene/' mdk/gradle.properties

      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build jarJar --no-daemon --stacktrace

      - name: Upload the mod
        uses: actions/upload-artifact@v4
        with:
          name: cutscene-mod
          path: mdk/build/libs/*.jar
